# SonarCloud Configuration
sonar.organization=pt-meeting-sampai-malam-konsultasi
sonar.projectKey=PT-Meeting-Sampai-Malam-Konsultasi_rusuh-app
sonar.projectName=Rusuh App
sonar.projectVersion=1.0

# Source code (all production Kotlin sources)
sonar.sources=shared/src/commonMain/kotlin,shared/src/androidMain/kotlin,shared/src/iosMain/kotlin,androidApp/src/main/kotlin

# Test sources
sonar.tests=shared/src/commonTest/kotlin,shared/src/androidUnitTest/kotlin

# Coverage report path (Kover XML format, JaCoCo-compatible)
sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Kotlin language settings
sonar.kotlin.file.suffixes=.kt,.kts

# Exclusions
sonar.exclusions=**/build/**,**/*.gradle.kts
# Coverage counts only ViewModels, use cases, repositories and API services (the Kover report is filtered the same
# way); everything else is excluded from the coverage figure but still analysed for bugs, smells and security.
sonar.coverage.exclusions=**/ui/**,**/*Screen*.kt,**/*Route*.kt,**/*Content*.kt,**/*Preview*.kt,**/*Section*.kt,\
  **/*Components*.kt,**/navigation/**,**/di/**,**/*Module*.kt,**/*Contract*.kt,**/*Mapper*.kt,**/*Dto*.kt,**/dto/**,\
  **/domain/model/**,**/data/stub/**,**/*Stub*.kt,**/androidMain/**,**/iosMain/**,**/androidApp/**,**/generated/**,\
  **/data/cache/**,**/data/storage/**,**/data/network/**,**/data/clock/**,**/data/platform/**,**/analytics/**,**/crash/**,\
  **/*Launcher*.kt,**/*WebView*.kt,**/App.kt,**/*Config*.kt,**/*State*.kt,**/*Models.kt
