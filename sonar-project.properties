# SonarQube Configuration
sonar.projectKey=rusuh-app
sonar.projectName=Rusuh App
sonar.projectVersion=1.0

# Source code
sonar.sources=shared/src/commonMain/kotlin,shared/src/androidMain/kotlin,shared/src/iosMain/kotlin,androidApp/src/main/java

# Test sources
sonar.tests=shared/src/commonTest/kotlin

# Coverage report paths (Kover XML format)
sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
sonar.kotlin.coverage.reportPaths=build/reports/kover/report.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Kotlin language settings
sonar.language=kotlin
sonar.kotlin.file.suffixes=.kt,.kts

# Exclusions
sonar.exclusions=**/build/**,**/*.gradle.kts
sonar.coverage.exclusions=**/ui/theme/**,**/*Module*.kt,**/di/**
