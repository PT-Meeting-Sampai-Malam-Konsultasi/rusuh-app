name: iOS Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# NOTE: This workflow requires iosApp/iosApp.xcodeproj to exist.
# The Xcode project should be configured with a Run Script Build Phase
# that builds the KMP shared framework before compiling Swift sources.

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Phase 1: Build KMP Shared Framework (Release for iOS device)
      - name: Build KMP Shared Framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      # Phase 2: Select Xcode version
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # Phase 3: Build unsigned iOS archive
      # The Xcode project should have a Build Phase script that copies
      # the framework from shared/build/bin/iosArm64/releaseFramework/
      - name: Build iOS Archive (Unsigned)
        run: |
          if [ -d "iosApp/iosApp.xcodeproj" ]; then
            xcodebuild archive \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ${{ runner.temp }}/iosApp.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              | xcpretty
          else
            echo "::warning::iosApp.xcodeproj not found. Skipping archive step."
            echo "KMP framework built successfully. Create the Xcode project to enable full iOS builds."
          fi

      - name: Upload Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/iosApp.xcarchive
          if-no-files-found: warn
