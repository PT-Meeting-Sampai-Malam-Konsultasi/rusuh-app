name: iOS Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# This workflow builds iOS schemes for the Rusuh KMP app.
# - Staging: archived via Fastlane (lane `build_unsigned`), uploaded as artifact
# - Production: simulator build via Fastlane (lane `build_production_simulator`) for verification

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Pin Xcode deterministically. macos-15 ships 16.4 as the default.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Build the staging scheme (KMP shared framework + unsigned archive) via Fastlane.
      - name: Build unsigned iOS staging archive (Fastlane)
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/Rusuh.xcarchive
        run: bundle exec fastlane build_unsigned

      # Build the production scheme for simulator (verification only).
      - name: Build production scheme for simulator (Fastlane)
        run: bundle exec fastlane build_production_simulator

      - name: Upload Staging Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-staging-unsigned
          path: ${{ runner.temp }}/Rusuh.xcarchive
          if-no-files-found: error
