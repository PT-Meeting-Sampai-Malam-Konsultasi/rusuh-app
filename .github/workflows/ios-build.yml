name: iOS Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# This workflow builds an UNSIGNED iOS .xcarchive for the Rusuh KMP app.
# The archive is driven by Fastlane (fastlane/Fastfile, lane `build_unsigned`),
# which first builds the KMP `shared` framework via Gradle, then archives the
# `Rusuh` scheme from iosApp/Rusuh.xcodeproj with code signing disabled.

jobs:
  build:
    # macos-15 is a supported GitHub-hosted label. macos-14 was resolving to an
    # unsupported runner configuration on this org, so the job died in ~1s.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Pin Xcode deterministically. macos-15 ships 16.4 as the default; the old
      # hardcoded /Applications/Xcode_15.4.app no longer exists on this image.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Build the KMP shared framework + unsigned archive via Fastlane.
      # The lane writes the archive to $ARCHIVE_PATH.
      - name: Build unsigned iOS archive (Fastlane)
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/Rusuh.xcarchive
        run: bundle exec fastlane build_unsigned

      - name: Upload Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/Rusuh.xcarchive
          if-no-files-found: error
