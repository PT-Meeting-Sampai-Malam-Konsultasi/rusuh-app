name: Android Build
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Write google-services.json if available
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
          fi
      - name: Build debug APKs (both flavors)
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Guard cleartext config (debug only)
        run: ./gradlew :androidApp:verifyNoCleartextOutsideDebug :androidApp:verifyMergedManifestsHaveInternet --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/*/debug/*.apk
