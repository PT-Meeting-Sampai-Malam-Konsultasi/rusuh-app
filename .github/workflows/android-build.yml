name: Android Build
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend of the distributed build: live (staging API) or stub (offline demo data)'
        type: choice
        options: [live, stub]
        default: live
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs (both flavors)
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Guard cleartext config (debug only)
        run: ./gradlew :androidApp:verifyNoCleartextOutsideDebug :androidApp:verifyMergedManifestsHaveInternet --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/*/debug/*.apk

  # Sends a build to Firebase App Distribution: the LIVE staging API by default (Home, login, queue, Detail and Tickets use the
  # real API; only payment falls back to stub data until its routes are deployed), or the offline stub demo on manual dispatch.
  # Runs on pushes to main and on manual dispatch. It does nothing until the repo secrets exist, so it can never
  # break CI. Setup and key rotation: docs/firebase-distribution.md.
  distribute:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' && (vars.FIREBASE_APP_ID != '' || secrets.FIREBASE_APP_ID != '') }}
    steps:
      - name: Skip when Firebase secrets are missing
        if: env.HAS_FIREBASE != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT_JSON (secret) or FIREBASE_APP_ID (variable or secret) is not set, skipping distribution."
      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_FIREBASE == 'true'
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_FIREBASE == 'true'
      - name: Pick the backend
        if: env.HAS_FIREBASE == 'true'
        env:
          BACKEND_INPUT: ${{ github.event.inputs.backend }}
        run: |
          BACKEND="${BACKEND_INPUT:-live}"
          if [ "$BACKEND" = "stub" ]; then echo "GRADLE_BACKEND_ARGS=-PbackendMode=Stub" >> "$GITHUB_ENV"; else echo "GRADLE_BACKEND_ARGS=-PmockApi=false" >> "$GITHUB_ENV"; fi
          echo "BUILD_BACKEND=$BACKEND" >> "$GITHUB_ENV"
      - name: Build staging APK (debug)
        if: env.HAS_FIREBASE == 'true'
        run: ./gradlew :androidApp:assembleStagingDebug $GRADLE_BACKEND_ARGS -PversionCode=${{ github.run_number }} --stacktrace
      - name: Upload to Firebase App Distribution
        if: env.HAS_FIREBASE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'rusuh-devs' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FIREBASE_APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"
          CREDS="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$CREDS"' EXIT
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDS"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
          APK="$(ls androidApp/build/outputs/apk/staging/debug/*.apk | head -n 1)"
          FIRST_LINE="$(printf '%s' "${COMMIT_MESSAGE:-manual run}" | head -n 1)"
          if [ "$BUILD_BACKEND" = "stub" ]; then LABEL="OFFLINE DEMO (stub data)"; else LABEL="LIVE staging API (payment still on stub data)"; fi
          NOTES="${LABEL}. ${COMMIT_SHA:0:7}: ${FIRST_LINE}"
          npx --yes firebase-tools@13 appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_GROUPS" \
            --release-notes "$NOTES"
