name: SonarQube Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate blame
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests with coverage
        run: ./gradlew :shared:allTests :androidApp:testDebugUnitTest koverXmlReport --stacktrace
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/
      - name: Check SonarQube configuration
        id: sonar-check
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ] && [ -n "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ SonarQube secrets not configured. Skipping scan."
            echo "To enable SonarQube analysis, add SONAR_TOKEN and SONAR_HOST_URL secrets."
          fi
      - name: SonarQube Scan
        if: steps.sonar-check.outputs.configured == 'true'
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
